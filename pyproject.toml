[project]
name = "kira"
version = "0.2.1"
description = "Voice-to-text menubar app — macOS + Windows 11"
requires-python = ">=3.12"
dependencies = [
  "sounddevice>=0.5.0",
  "numpy>=2.0",
  "ollama>=0.4",
  "pyperclip>=1.9",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "packaging>=24.0",
]

[project.optional-dependencies]
mac = [
  "mlx-whisper>=0.4.0",
  "pynput>=1.7",
  "rumps>=0.4",
  "pyobjc-framework-Cocoa>=11.0",
  "pyobjc-framework-Quartz>=11.0",
  "pyobjc-framework-ApplicationServices>=11.0",
]
windows = [
  "faster-whisper>=1.1",
  "pystray>=0.19",
  "Pillow>=10.0",
  "PyQt6>=6.7",
  "keyboard>=0.13",
  "pywin32>=306",
  "psutil>=5.9",
  "platformdirs>=4.0",
  "nvidia-cudnn-cu12>=9.0",
  "nvidia-cublas-cu12>=12.0",
  "huggingface_hub>=0.20",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-qt>=4.4",
  "pytest-mock>=3.12",
  "py2app>=0.28; sys_platform == 'darwin'",
  "soundfile>=0.12",
]

[tool.pytest.ini_options]
markers = [
  "integration: slow integration test, needs model download",
  "windows_only: test requires Windows platform",
  "mac_only: test requires macOS platform",
]

[project.scripts]
kira-once = "kira.cli:main"

[project.gui-scripts]
# Tray app — uses pythonw.exe on Windows so no console window opens.
# kira-once stays as a console script for stdin/stdout debugging.
kira = "kira.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kira"]

# Bundle-Mode (Slim-Installer): assets + Ollama-Setup-EXE + prompts landen
# mit ins wheel als kira/_assets/, kira/_embedded/, kira/_prompts/.
# Sonst findet `Path(__file__).parent.parent` beim Wheel-Install nichts
# (resolved zu site-packages/, nicht repo-root). Editable-Install ignoriert
# force-include (gilt nur fuer wheel-target), Editable-Mode nutzt den
# klassischen Source-Tree-Lookup.
[tool.hatch.build.targets.wheel.force-include]
"assets/icon-branded.ico" = "kira/_assets/icon-branded.ico"
"assets/icon.ico" = "kira/_assets/icon.ico"
"assets/digitalroots-logo.png" = "kira/_assets/digitalroots-logo.png"
"assets/kira-splash.png" = "kira/_assets/kira-splash.png"
"prompts" = "kira/_prompts"
# OllamaSetup.exe (~1.98 GB) wird BEWUSST NICHT ins wheel gepackt:
#  - waere das Wheel ~2.1 GB statt ~50 KB
#  - Inno-Bundle haette OllamaSetup.exe DOPPELT (Wheel + tmp-Run-Step)
# Stattdessen: Inno deployed nach {app}\installer\embedded\, und
# kira/main.py:_resource_path detected den Bundle-Mode via sys.executable.
